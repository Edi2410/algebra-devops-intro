
services:
  nginx:
    build: ./nginx
    container_name: tempconverter_nginx
    restart: unless-stopped
    ports:
      - "8700:80"
    depends_on:
      - tempconverter_app
    networks:
      - app_network

  tempconverter_app:
    build: ./tempconverter
    restart: unless-stopped
    container_name: tempconverter_app
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
    # deploy:
    #   replicas: 2
    depends_on:
      - tempconverter_db
    networks:
      - app_network
      - db_network

  tempconverter_db:
    container_name: ${DB_HOST}
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - "./db-data:/var/lib/mysql"
    networks:
      - db_network


networks:
 app_network:
 db_network: